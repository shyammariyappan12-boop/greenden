<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenden | Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-green-800 text-white px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-50">
    <h1 class="text-2xl font-bold tracking-wide">Greenden 🌿</h1>
    <ul class="flex gap-6 font-medium">
      <li><a href="index.html" class="hover:text-green-300 transition">Home</a></li>
      <li><a href="products.html" class="hover:text-green-300 transition">Products</a></li>
      <li><a href="contact.html" class="hover:text-green-300 transition">Contact</a></li>
    </ul>
  </nav>

  <!-- Contact Form Section -->
  <section class="max-w-3xl mx-auto py-12 px-6">
    <h2 class="text-3xl font-bold text-center text-green-800 mb-8">Contact Us</h2>
    
    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100">
      <form class="space-y-4">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Your Name</label>
          <input type="text" placeholder="Enter your name" class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">Your Email</label>
          <input type="email" placeholder="Enter your email" class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">Message</label>
          <textarea rows="4" placeholder="Write your message here..." class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"></textarea>
        </div>
        <button type="button" class="w-full bg-green-700 text-white py-3 rounded-lg font-semibold hover:bg-green-800 transition">Send Message</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-green-900 text-white py-6 text-center text-sm">
    <p>&copy; 2026 Greenden. All rights reserved.</p>
  </footer>

</body>
</html>
