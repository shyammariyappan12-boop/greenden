<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greenden - Contact</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="header">
        <div class="logo">Greenden 🌱</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>


    <!-- Contact Section -->
    <section class="contact-section">

        <div class="contact-content">

            <h1>Contact Us</h1>

            <p>
                Have questions about our plants or products?
                We'd love to hear from you.
            </p>

            <form>

                <label>Name</label>
                <input type="text" placeholder="Enter your name">

                <label>Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Message</label>
                <textarea rows="6" placeholder="Enter your message"></textarea>

                <button type="submit">Send Message</button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <h2>Greenden 🌱</h2>
        <p>Growing a greener and healthier world.</p>
        <p>© 2026 Greenden. All Rights Reserved.</p>
    </footer>

</body>
</html>
