<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenden | Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-green-800 text-white px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-50">
    <h1 class="text-2xl font-bold tracking-wide">Greenden 🌿</h1>
    <ul class="flex gap-6 font-medium">
      <li><a href="index.html" class="hover:text-green-300 transition">Home</a></li>
      <li><a href="products.html" class="hover:text-green-300 transition">Products</a></li>
      <li><a href="contact.html" class="hover:text-green-300 transition">Contact</a></li>
    </ul>
  </nav>

  <!-- Products Section -->
  <section class="max-w-6xl mx-auto py-12 px-6">
    <h2 class="text-3xl font-bold text-center text-green-800 mb-8">Our Plant Collection</h2>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      
      <!-- Product Card 1 -->
      <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
        <img src="https://images.unsplash.com/photo-1545241047-6083a3684587?w=400" alt="Snake Plant" class="w-full h-48 object-cover">
        <div class="p-4">
          <h3 class="font-bold text-lg text-gray-800">Snake Plant</h3>
          <p class="text-green-700 font-semibold my-1">₹299</p>
          <button class="w-full mt-2 bg-green-700 text-white py-2 rounded hover:bg-green-800 transition text-sm">Add to Cart</button>
        </div>
      </div>

      <!-- Product Card 2 -->
      <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
        <img src="https://images.unsplash.com/photo-1512428559087-560fa5ceab42?w=400" alt="Monstera" class="w-full h-48 object-cover">
        <div class="p-4">
          <h3 class="font-bold text-lg text-gray-800">Monstera Deliciosa</h3>
          <p class="text-green-700 font-semibold my-1">₹499</p>
          <button class="w-full mt-2 bg-green-700 text-white py-2 rounded hover:bg-green-800 transition text-sm">Add to Cart</button>
        </div>
      </div>

      <!-- Product Card 3 -->
      <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
        <img src="https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?w=400" alt="Succulent" class="w-full h-48 object-cover">
        <div class="p-4">
          <h3 class="font-bold text-lg text-gray-800">Mini Succulent</h3>
          <p class="text-green-700 font-semibold my-1">₹199</p>
          <button class="w-full mt-2 bg-green-700 text-white py-2 rounded hover:bg-green-800 transition text-sm">Add to Cart</button>
        </div>
      </div>

      <!-- Product Card 4 -->
      <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
        <img src="https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=400" alt="Aloe Vera" class="w-full h-48 object-cover">
        <div class="p-4">
          <h3 class="font-bold text-lg text-gray-800">Aloe Vera</h3>
          <p class="text-green-700 font-semibold my-1">₹249</p>
          <button class="w-full mt-2 bg-green-700 text-white py-2 rounded hover:bg-green-800 transition text-sm">Add to Cart</button>
        </div>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-green-900 text-white py-6 text-center text-sm">
    <p>&copy; 2026 Greenden. All rights reserved.</p>
  </footer>

</html>
